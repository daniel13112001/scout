# Global scout configuration. Auto-created on first run at
# <os user config dir>/scout/scoutconfig.toml - edit freely.

[embedder]
model_path       = "models/model_qint8_avx512_vnni.onnx"
tokenizer_path   = "models/tokenizer.json"
ort_library_path = "third_party/onnxruntime/libonnxruntime.dylib"
batch_size       = 32

[db]
# Relative paths are resolved against this config file's own directory.
path = "scout.db"

[index]
# Files larger than this are skipped (recorded in `files` with
# status = "skipped") rather than embedded.
max_file_size_mb = 2

# Closed list by design: a file is only indexed if its extension is here.
# Add an extension to opt it in - safer than trying to enumerate every
# binary format that should be excluded.
allowed_extensions = [
    ".txt", ".md", ".markdown", ".rst",
    ".go", ".py", ".js", ".jsx", ".ts", ".tsx",
    ".java", ".c", ".h", ".cpp", ".hpp", ".rs",
    ".rb", ".php", ".sh", ".sql",
    ".html", ".css", ".scss",
    ".json", ".yaml", ".yml", ".toml", ".xml",
    ".swift", ".kt",
]

# Directories skipped everywhere, regardless of .gitignore. A .gitignore
# in the indexed directory, if present, is always respected on top of this.
ignore_dirs = [
    "node_modules", ".git", ".svn", ".hg",
    "vendor", "dist", "build", ".next",
    ".venv", "venv", "__pycache__", ".cache", "target",
]

# File-name glob patterns, matched the same way .gitignore patterns are.
ignore_patterns = [
    ".DS_Store",
    ".env",
    ".env.*",
]
